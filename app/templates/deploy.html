{% extends "base.html" %}

{% block content %}
<div class="header">
    <div>
        <h1>Deploy New Container</h1>
        <p>Create a new Docker container with resource limits and optional health check.</p>
    </div>
    <a class="action-btn" href="/ui">Back to Dashboard</a>
</div>

<div class="card">
    <form method="post" action="/ui/deploy">
        <div class="form-grid">
            <div class="form-group">
                <label>App Name</label>
                <input name="app_name" placeholder="demo-nginx" required>
            </div>

            <div class="form-group">
                <label>Docker Image</label>
                <input name="image" placeholder="nginx:latest" required>
            </div>

            <div class="form-group">
                <label>Host Port</label>
                <input name="host_port" type="number" value="8085" required>
            </div>

            <div class="form-group">
                <label>Container Port</label>
                <input name="container_port" type="number" value="80" required>
            </div>

            <div class="form-group">
                <label>Memory Limit</label>
                <input name="memory_limit" value="256m">
            </div>

            <div class="form-group">
                <label>CPU Limit</label>
                <input name="cpu_limit" type="number" step="0.1" value="0.5">
            </div>

            <div class="form-group">
                <label>Health Path</label>
                <input name="health_path" value="/">
            </div>

            <div class="form-group">
                <label>Health Check Enabled</label>
                <select name="health_check_enabled">
                    <option value="true" selected>Enabled</option>
                    <option value="false">Disabled</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button class="primary-btn" type="submit">Deploy Container</button>
        </div>
    </form>
</div>
{% endblock %}
